# 운영(prod) 프로필. DB 접속 정보는 환경 변수(SPRING_DATASOURCE_*)로 넣는다. 비밀 값을 여기에 적지 않는다.
server:
  servlet:
    session:
      cookie:
        # 시연은 HTTP다 (docs/backend_design.md D21). HTTPS 환경에서만 SESSION_COOKIE_SECURE=true 로 켠다.
        # http-only, same-site 는 application.yml 의 값이 그대로 적용된다.
        secure: ${SESSION_COOKIE_SECURE:false}
