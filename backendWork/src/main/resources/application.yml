# 비밀이 아닌 공통 설정. DB 계정은 application-local.yml(커밋 금지) 또는 환경 변수로 넣는다.
spring:
  application:
    name: memorytrace
  jpa:
    hibernate:
      ddl-auto: validate          # 테이블은 docs/*.sql 로만 만든다
    open-in-view: false
  sql:
    init:
      mode: never                 # 서버가 SQL을 자동 실행하지 않는다
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  forward-headers-strategy: none  # X-Forwarded-* 를 신뢰하지 않는다 (프록시를 둘 때만 범위를 정해 연다)
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax

---
# 로컬 개발 설정 파일을 읽는다. 통합 테스트 프로필은 개발 DB 설정을 물려받지 않는다.
spring:
  config:
    activate:
      on-profile: "!integration-test"
    import: "optional:classpath:application-local.yml"
